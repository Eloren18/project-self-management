name: Deploy static site to GitHub Pages

# Runs on every push to main, and can be triggered manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy needs. id-token is required by deploy-pages@v4.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; don't cancel an in-flight publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repo root (index.html lives here). No Jekyll build.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true   # don't fail the job yet — we retry below
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000    # the action's allowed maximum (10 min)
          error_count: 15    # tolerate transient status-poll errors

      # GitHub Pages flakes with "Deployment failed, try again later" during
      # degraded periods; a spaced second attempt usually lands (2026-07-02:
      # every successful publish that day was a retry attempt).
      - name: Cool down before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 15
